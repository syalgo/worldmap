<script>
(()=>{
const worksheet=document.getElementById('worksheet'),mapShell=document.getElementById('mapShell'),mapStage=document.getElementById('mapStage'),mapSvg=document.getElementById('mapSvg'),zoomLabel=document.getElementById('zoomLabel'),status=document.getElementById('status');
const colors=[document.getElementById('c1'),document.getElementById('c2'),document.getElementById('c3')],swatches=[document.getElementById('sw1'),document.getElementById('sw2'),document.getElementById('sw3')];
const countryStates=new Map(),state={scale:1,x:0,y:0},pointers=new Map();const SCALE_MIN=1,SCALE_MAX=4,ZOOM_STEP=1.2;let dragState=null,pinchState=null,pressCountry=null,pressPointerId=null,pressStartX=0,pressStartY=0,dragMoved=false,lastPaintCountry=null,lastPaintAt=0,recentDragUntil=0;

function refreshSwatches(){swatches.forEach((sw,i)=>sw.style.background=colors[i].value)}refreshSwatches();document.querySelectorAll('.swatch-btn').forEach(btn=>btn.addEventListener('click',()=>document.getElementById(btn.dataset.for).click()));colors.forEach(input=>input.addEventListener('input',()=>{refreshSwatches();repaintCountries()}));
function colorForState(n){return n?colors[n-1].value:'#fff'}function repaintCountries(){document.querySelectorAll('.country').forEach(path=>{const n=Number(path.dataset.country);path.style.fill=colorForState(countryStates.get(n)||0)})}function cycleCountry(n){if(!n)return;countryStates.set(n,((countryStates.get(n)||0)+1)%4);repaintCountries()}function paintCountry(n){if(!n)return;const now=Date.now();if(lastPaintCountry===n&&now-lastPaintAt<220)return;cycleCountry(n);lastPaintCountry=n;lastPaintAt=now}repaintCountries();
function findCountry(node){while(node&&node!==mapSvg){if(node.nodeType===1&&node.dataset?.country)return Number(node.dataset.country);node=node.parentNode}return null}
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}function constrain(){const w=mapShell.clientWidth,h=mapShell.clientHeight,sw=w*state.scale,sh=h*state.scale;state.x=sw<=w?0:clamp(state.x,w-sw,0);state.y=sh<=h?0:clamp(state.y,h-sh,0)}function applyTransform(){constrain();mapStage.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.scale})`;zoomLabel.textContent=`${Math.round(state.scale*100)}%`}function zoomAt(clientX,clientY,factor){const r=mapShell.getBoundingClientRect(),fx=clientX-r.left,fy=clientY-r.top,ix=(fx-state.x)/state.scale,iy=(fy-state.y)/state.scale,ns=clamp(state.scale*factor,SCALE_MIN,SCALE_MAX);state.x=fx-ix*ns;state.y=fy-iy*ns;state.scale=ns;applyTransform()}function zoomCenter(f){const r=mapShell.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}function resetView(){state.scale=1;state.x=0;state.y=0;applyTransform()}
document.getElementById('zoomIn').addEventListener('click',()=>zoomCenter(ZOOM_STEP));document.getElementById('zoomOut').addEventListener('click',()=>zoomCenter(1/ZOOM_STEP));document.getElementById('resetView').addEventListener('click',resetView);document.getElementById('resetPaint').addEventListener('click',()=>{countryStates.clear();repaintCountries()});mapShell.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12)},{passive:false});mapSvg.addEventListener('click',e=>{const n=findCountry(e.target);if(n&&Date.now()>=recentDragUntil)paintCountry(n)});
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function center(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}function beginDrag(p){dragState={px:p.x,py:p.y,x:state.x,y:state.y};dragMoved=false}function beginPinch(){const [a,b]=[...pointers.values()].slice(0,2);if(!a||!b)return;const r=mapShell.getBoundingClientRect(),c=center(a,b),lx=c.x-r.left,ly=c.y-r.top;pinchState={d:dist(a,b),scale:state.scale,ix:(lx-state.x)/state.scale,iy:(ly-state.y)/state.scale};dragState=null;pressCountry=null}

function endPointer(e,allowPaint){const should=allowPaint&&pointers.size===1&&pressPointerId===e.pointerId&&pressCountry&&!dragMoved&&!pinchState,n=should?pressCountry:null;pointers.delete(e.pointerId);try{mapShell.releasePointerCapture(e.pointerId)}catch(_){}if(n)paintCountry(n);if(!pointers.size){dragState=null;pinchState=null;pressCountry=null;pressPointerId=null;dragMoved=false;mapShell.classList.remove('dragging')}else if(pointers.size===1){pinchState=null;pressCountry=null;pressPointerId=null;beginDrag([...pointers.values()][0])}}mapShell.addEventListener('pointerup',e=>endPointer(e,true));mapShell.addEventListener('pointercancel',e=>endPointer(e,false));window.addEventListener('resize',applyTransform);applyTransform();

  const mc=mapSvg.cloneNode(true);mc.removeAttribute('id');mc.setAttribute('x',mapX);mc.setAttribute('y',mapY);mc.setAttribute('width',mapW);mc.setAttribute('height',mapH);mc.setAttribute('preserveAspectRatio','none');

  pieces.push(`<text x="885" y="${ly}" class="serif" font-size="18" font-weight="700" text-anchor="middle">Choose a color for each</text>`);
  pieces.push(`<text x="885" y="${ly+23}" class="serif" font-size="18" font-weight="700" text-anchor="middle">category and color each one</text>`);
  pieces.push(`<text x="885" y="${ly+46}" class="serif" font-size="18" font-weight="700" text-anchor="middle">in accordingly.</text>`);
  const legendNames=['Triple Entente','Triple Alliance','Neutral'];

}
